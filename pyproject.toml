[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vcard-parser-service"
version = "1.0.0"
description = "FastAPI service backed by a native C vCard parser"
requires-python = ">=3.11"
dependencies = ["fastapi==0.121.0", "pydantic==2.12.3", "python-multipart==0.0.20", "uvicorn==0.38.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
